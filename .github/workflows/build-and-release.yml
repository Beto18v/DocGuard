name: Build & Package Extensions Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Extension Dependencies
        run: |
          npm install
          npm --prefix extensions/dark-mode install
          npm --prefix extensions/docguard install
          npm --prefix extensions/recordflow install

      - name: Run Automated Tests
        run: npm run test:docguard

      - name: Package All Extensions to Root /releases
        run: npm run pack

      - name: Upload Packaged Zips as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extensions-suite-zips
          path: releases/*.zip
